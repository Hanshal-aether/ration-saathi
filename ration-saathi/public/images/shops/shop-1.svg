<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  <g transform="translate(200, 150)">
    <!-- Shop building -->
    <rect x="-80" y="-60" width="160" height="100" fill="#2563eb" rx="4"/>
    <!-- Door -->
    <rect x="-30" y="-20" width="60" height="80" fill="#1e40af" rx="2"/>
    <!-- Door handle -->
    <circle cx="25" cy="20" r="3" fill="#fbbf24"/>
    <!-- Windows -->
    <rect x="-70" y="-50" width="30" height="30" fill="#60a5fa" rx="2"/>
    <rect x="40" y="-50" width="30" height="30" fill="#60a5fa" rx="2"/>
    <!-- Roof -->
    <polygon points="-100,-60 0,-100 100,-60" fill="#1e40af"/>
    <!-- Sign -->
    <rect x="-50" y="-95" width="100" height="20" fill="#dc2626" rx="3"/>
    <text x="0" y="-80" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">FPS</text>
  </g>
</svg>