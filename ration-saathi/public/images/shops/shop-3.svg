<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <g transform="translate(200, 150)">
    <!-- Modern storefront -->
    <rect x="-70" y="-50" width="140" height="90" fill="#7c3aed" rx="8"/>
    <!-- Large display window -->
    <rect x="-65" y="-45" width="130" height="50" fill="#a78bfa" rx="4"/>
    <!-- Door entrance -->
    <path d="M -30 5 Q -30 20 -25 25 L 25 25 Q 30 20 30 5" fill="#6d28d9"/>
    <!-- Entrance detail -->
    <rect x="-20" y="25" width="40" height="3" fill="#a78bfa"/>
    <!-- Awning -->
    <polygon points="-80,-50 -70,-65 70,-65 80,-50" fill="#6d28d9"/>
  </g>
</svg>